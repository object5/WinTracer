name: build

on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore WinTracer.sln

      - name: Build
        run: dotnet build WinTracer.sln -c Release --no-restore

      - name: Test
        run: dotnet test WinTracer.sln -c Release --no-build --logger "trx;LogFileName=results.trx" --results-directory test-results

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results

      - name: Publish
        run: dotnet publish SpaceTracer/WinTracer.csproj -c Release -r win-x64 --self-contained false -p:PublishSingleFile=true -o publish

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: WinTracer-win-x64
          path: publish

      - name: Zip for release
        if: startsWith(github.ref, 'refs/tags/v')
        run: Compress-Archive -Path publish/* -DestinationPath WinTracer-${{ github.ref_name }}-win-x64.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: WinTracer-${{ github.ref_name }}-win-x64.zip
